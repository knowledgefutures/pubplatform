name: Promote from main (new)

on:
    push:
        branches:
            - main
    workflow_dispatch:

permissions:
    contents: read
    packages: write
    pull-requests: write

concurrency:
    group: deploy-sandbox
    cancel-in-progress: false

jobs:
    ci:
        uses: ./.github/workflows/ci.yml

    build-all:
        needs: ci
        permissions:
            contents: read
            packages: write
        uses: ./.github/workflows/ghcr-build-all.yml
        secrets:
            SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        with:
            publish_latest: true

    run-e2e:
        needs:
            - ci
            - build-all
        uses: ./.github/workflows/e2e.yml

    deploy-sandbox:
        # disabled: sandbox is switched off. remove to re-enable
        if: false
        needs: build-all
        permissions:
            contents: read
            packages: read
            id-token: write
        uses: ./.github/workflows/deploy-stack.yml
        with:
            action: deploy
            environment: sandbox
            image_tag: ${{ github.sha }}
            stack_name: sandbox
            hostname: sandbox.pubstar.org
            stack_file: stack.preview.yml
            uses_gateway: true

    deploy-docs:
        permissions:
            contents: write
            pages: write
            pull-requests: write
        uses: ./.github/workflows/build-docs.yml
        with:
            preview: false
