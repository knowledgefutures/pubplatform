name: Deploy Stack

# Deploys a stack or prunes previews; values and SSH key come from the KF console.

on:
    workflow_call:
        inputs:
            action:
                required: true
                type: string
                description: "'deploy' or 'prune-previews'"
            environment:
                required: true
                type: string
                description: "the console environment, and the GitHub Environment the job runs in: 'production' or 'sandbox'"
            image_tag:
                required: false
                type: string
                description: "image tag to deploy"
            stack_name:
                required: false
                type: string
                description: "docker swarm stack name"
            hostname:
                required: false
                type: string
                description: "public hostname for this deployment"
            stack_file:
                required: false
                type: string
                description: "compose file to deploy (stack.yml or stack.preview.yml)"
            uses_gateway:
                required: false
                type: boolean
                default: false
                description: "if true, deploy behind the shared Caddy gateway"
            keep_previews:
                required: false
                type: string
                default: ""
                description: "prune-previews: the PR numbers whose preview stacks stay, space-separated"

permissions: {}

jobs:
    deploy:
        if: inputs.action == 'deploy'
        runs-on: ubuntu-latest
        timeout-minutes: 15
        environment: ${{ inputs.environment }}
        permissions:
            contents: read
            packages: read
            id-token: write
        env:
            KF: npx --yes --ignore-scripts @knowledgefutures/kf@0.7.0
            KF_CONSOLE_URL: ${{ vars.KF_CONSOLE_URL || 'https://console.knowledgefutures.org' }}
        steps:
            # For infra/deploy-remote.sh at the commit being deployed.
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
              with:
                  persist-credentials: false

            - name: Check inputs
              env:
                  ENVIRONMENT: ${{ inputs.environment }}
                  IMAGE_TAG: ${{ inputs.image_tag }}
                  STACK_NAME: ${{ inputs.stack_name }}
                  PUBLIC_HOST: ${{ inputs.hostname }}
                  STACK_FILE: ${{ inputs.stack_file }}
              run: |
                  set -euo pipefail
                  fail() { echo "::error::$1"; exit 1; }
                  [[ "$ENVIRONMENT" =~ ^(production|sandbox)$ ]] || fail "environment ${ENVIRONMENT} is not production or sandbox"
                  [[ "$IMAGE_TAG" =~ ^[A-Za-z0-9._-]+$ ]] || fail "image tag ${IMAGE_TAG} has characters a deploy won't send"
                  [[ "$STACK_NAME" =~ ^[a-z0-9-]+$ ]] || fail "stack name ${STACK_NAME} is not [a-z0-9-]"
                  [[ "$PUBLIC_HOST" =~ ^[a-z0-9.-]+$ ]] || fail "hostname ${PUBLIC_HOST} is not a hostname"
                  [[ "$STACK_FILE" =~ ^stack(\.preview)?\.yml$ ]] || fail "stack file ${STACK_FILE} is not stack.yml or stack.preview.yml"

            - name: Set up Node.js
              uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
              with:
                  node-version: 24

            - name: Load the deploy key
              id: ssh
              env:
                  ENVIRONMENT: ${{ inputs.environment }}
              run: $KF ci ssh-agent -e "$ENVIRONMENT"

            # Registry token, then the values, on stdin.
            - name: Deploy stack
              env:
                  ENVIRONMENT: ${{ inputs.environment }}
                  DEPLOY_USER: ${{ steps.ssh.outputs.DEPLOY_USER }}
                  DEPLOY_HOST: ${{ steps.ssh.outputs.DEPLOY_HOST }}
                  REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  REGISTRY_USER: ${{ github.actor }}
                  REPO: ${{ github.repository }}
                  SHA: ${{ github.sha }}
                  IMAGE_TAG: ${{ inputs.image_tag }}
                  STACK_NAME: ${{ inputs.stack_name }}
                  PUBLIC_HOST: ${{ inputs.hostname }}
                  STACK_FILE: ${{ inputs.stack_file }}
                  USES_GATEWAY: ${{ inputs.uses_gateway }}
              run: |
                  set -euo pipefail
                  remote=$(base64 -w0 infra/deploy-remote.sh)
                  {
                    printf '%s\n' "$REGISTRY_TOKEN"
                    $KF ci secrets --runtime -e "$ENVIRONMENT"
                  } | ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -l "$DEPLOY_USER" -- "$DEPLOY_HOST" \
                    "bash -c \"\$(echo $remote | base64 -d)\" deploy-remote deploy '$REPO' '$SHA' '$IMAGE_TAG' '$STACK_NAME' '$PUBLIC_HOST' '$STACK_FILE' '$USES_GATEWAY' '$REGISTRY_USER'"

    # Removes preview stacks of PRs not in keep_previews.
    prune-previews:
        if: inputs.action == 'prune-previews'
        runs-on: ubuntu-latest
        timeout-minutes: 10
        environment: ${{ inputs.environment }}
        permissions:
            contents: read
            id-token: write
        env:
            KF: npx --yes --ignore-scripts @knowledgefutures/kf@0.7.0
            KF_CONSOLE_URL: ${{ vars.KF_CONSOLE_URL || 'https://console.knowledgefutures.org' }}
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
              with:
                  persist-credentials: false

            - name: Check inputs
              env:
                  ENVIRONMENT: ${{ inputs.environment }}
                  KEEP: ${{ inputs.keep_previews }}
              run: |
                  set -euo pipefail
                  [[ "$ENVIRONMENT" == sandbox ]] || { echo "::error::previews are sandbox's"; exit 1; }
                  [[ "$KEEP" =~ ^[0-9\ ]*$ ]] || { echo "::error::keep_previews is not PR numbers"; exit 1; }

            - name: Set up Node.js
              uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
              with:
                  node-version: 24

            - name: Load the deploy key
              id: ssh
              env:
                  ENVIRONMENT: ${{ inputs.environment }}
              run: $KF ci ssh-agent -e "$ENVIRONMENT"

            - name: Prune previews
              env:
                  DEPLOY_USER: ${{ steps.ssh.outputs.DEPLOY_USER }}
                  DEPLOY_HOST: ${{ steps.ssh.outputs.DEPLOY_HOST }}
                  KEEP: ${{ inputs.keep_previews }}
              run: |
                  set -euo pipefail
                  remote=$(base64 -w0 infra/deploy-remote.sh)
                  ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -l "$DEPLOY_USER" -- "$DEPLOY_HOST" \
                    "bash -c \"\$(echo $remote | base64 -d)\" deploy-remote prune-previews '$KEEP'" </dev/null
