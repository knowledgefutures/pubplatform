name: Manual Deploy

on:
    workflow_dispatch:
        inputs:
            environment:
                description: "Target environment"
                required: true
                type: choice
                options:
                    - sandbox
                    - production
            image_tag:
                description: "sandbox: an existing image tag to deploy (leave empty to build from main). production deploys the tag it is dispatched on."
                required: false
                type: string

# The KF console hands values only to a run on the environment's ref:
# sandbox from main, production from a v* tag (in the GitHub Environment
# production). Dispatch on any other ref and the deploy is refused.

permissions: {}

concurrency:
    group: deploy-${{ inputs.environment == 'production' && 'pubstar' || 'sandbox' }}
    cancel-in-progress: false

jobs:
    # Said before anything is built: the console would refuse it anyway.
    check-ref:
        runs-on: ubuntu-latest
        permissions: {}
        steps:
            - name: Check the ref
              env:
                  ENVIRONMENT: ${{ inputs.environment }}
                  REF: ${{ github.ref }}
                  IMAGE_TAG: ${{ inputs.image_tag }}
              run: |
                  set -euo pipefail
                  if [[ "$ENVIRONMENT" == production ]]; then
                    [[ "$REF" == refs/tags/v* ]] || { echo "::error::production deploys from a v* tag: dispatch this on the tag, not ${REF}"; exit 1; }
                    [[ -z "$IMAGE_TAG" || "refs/tags/$IMAGE_TAG" == "$REF" ]] || { echo "::error::production deploys the tag's own image, not ${IMAGE_TAG}"; exit 1; }
                  else
                    [[ "$REF" == refs/heads/main ]] || { echo "::error::sandbox deploys from main: dispatch this on main, not ${REF}"; exit 1; }
                  fi

    build-all:
        if: inputs.image_tag == '' && inputs.environment == 'sandbox'
        needs: check-ref
        permissions:
            contents: read
            packages: write
        uses: ./.github/workflows/ghcr-build-all.yml
        secrets:
            SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

    deploy-sandbox:
        if: always() && needs.check-ref.result == 'success' && inputs.environment == 'sandbox' && (needs.build-all.result == 'success' || needs.build-all.result == 'skipped')
        needs: [check-ref, build-all]
        permissions:
            contents: read
            packages: read
            id-token: write
        uses: ./.github/workflows/deploy-stack.yml
        with:
            action: deploy
            environment: sandbox
            image_tag: ${{ inputs.image_tag || github.sha }}
            stack_name: sandbox
            hostname: sandbox.pubstar.org
            stack_file: stack.preview.yml
            uses_gateway: true

    deploy-prod:
        if: inputs.environment == 'production'
        needs: check-ref
        permissions:
            contents: read
            packages: read
            id-token: write
        uses: ./.github/workflows/deploy-stack.yml
        with:
            action: deploy
            environment: production
            image_tag: ${{ github.ref_name }}
            stack_name: pubstar
            hostname: app.pubstar.org
            stack_file: stack.yml
            uses_gateway: false
