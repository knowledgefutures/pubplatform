name: Release & deploy

on:
    push:
        tags:
            - "v[0-9]*.[0-9]*.[0-9]*"

# No id-token here: only deploy-stack.yml's deploy jobs ask for one.
permissions:
    contents: write
    packages: write
    pull-requests: write

concurrency:
    group: deploy-prod
    cancel-in-progress: false

jobs:
    validate-tag:
        runs-on: ubuntu-latest
        outputs:
            prerelease: ${{ steps.meta.outputs.prerelease }}
        steps:
            - name: Validate semver and detect pre-release
              id: meta
              run: |
                  tag="${{ github.ref_name }}"

                  if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc|experimental)\.[0-9]+)?$ ]]; then
                    echo "::error::Tag '$tag' does not match semver format (vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-{alpha,beta,rc,experimental}.N)"
                    exit 1
                  fi

                  if [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                    echo "prerelease=false" >> $GITHUB_OUTPUT
                  else
                    echo "prerelease=true" >> $GITHUB_OUTPUT
                  fi

    build-all:
        needs: validate-tag
        permissions:
            contents: read
            packages: write
        uses: ./.github/workflows/ghcr-build-all.yml
        with:
            image_tag: ${{ github.ref_name }}
            publish_latest: ${{ needs.validate-tag.outputs.prerelease == 'false' }}
        secrets:
            SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

    create-release:
        needs:
            - validate-tag
            - build-all
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v6

            - name: Create GitHub release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  flags="--generate-notes"

                  if [[ "${{ needs.validate-tag.outputs.prerelease }}" == "true" ]]; then
                    flags="$flags --prerelease"
                  fi

                  gh release create "${{ github.ref_name }}" $flags

    deploy-prod:
        needs:
            - validate-tag
            - build-all
        # Production's values and SSH key come from the KF console, to a run
        # on a v* tag in the GitHub Environment production (deploy-stack.yml).
        permissions:
            contents: read
            packages: read
            id-token: write
        uses: ./.github/workflows/deploy-stack.yml
        with:
            action: deploy
            environment: production
            image_tag: ${{ github.ref_name }}
            stack_name: pubstar
            hostname: app.pubstar.org
            stack_file: stack.yml
            uses_gateway: false
