apiVersion: apps/v1
kind: Deployment
metadata:
  name: site-builder
  labels:
    app.kubernetes.io/name: pubstar
    app.kubernetes.io/component: site-builder
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/component: site-builder
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pubstar
        app.kubernetes.io/component: site-builder
    spec:
      imagePullSecrets:
        - name: ghcr
      containers:
        - name: site-builder
          image: ghcr.io/knowledgefutures/platform-site-builder:IMAGE_TAG
          ports:
            - containerPort: 4000
          envFrom:
            - secretRef:
                name: pubstar-env
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "4000"
            - name: PUBSTAR_URL
              value: http://core:3000
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
