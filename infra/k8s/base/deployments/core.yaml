apiVersion: apps/v1
kind: Deployment
metadata:
  name: core
  labels:
    app.kubernetes.io/name: pubstar
    app.kubernetes.io/component: core
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/component: core
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pubstar
        app.kubernetes.io/component: core
    spec:
      imagePullSecrets:
        - name: ghcr
      initContainers:
        - name: wait-for-db
          image: postgres:17-alpine
          command: ["sh", "-c", "until pg_isready -h db -p 5432; do sleep 2; done"]
      containers:
        - name: core
          image: ghcr.io/knowledgefutures/platform:IMAGE_TAG
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: pubstar-env
          env:
            - name: HOSTNAME
              value: "0.0.0.0"
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3000"
            - name: SITE_BUILDER_ENDPOINT
              value: http://site-builder:4000
            - name: VALKEY_HOST
              value: valkey
            - name: VALKEY_PORT
              value: "6379"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 2Gi
